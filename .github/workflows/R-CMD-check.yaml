# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # OpenMP, FFTW and TIFF are all optional at build time: configure falls
      # back to a serial CImg-only build when it cannot find them, so a missing
      # formula yields a green run that silently tests far less than intended.
      # Install them explicitly so the macOS leg exercises the full build.
      # libomp is keg-only, which is why configure passes its include directory
      # explicitly rather than relying on it being on the default search path.
      - name: Install X11 and image libraries on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install pkg-config fftw libomp libtiff


      - name: Install X11 on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg \
            xvfb \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxi-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # The vendored CImg.h carries local patches that a re-vendor can silently
      # drop; see inst/include/NOTE_CImg and tools/check_cimg_patches.R. This
      # runs before the build because the patches are source-level: a missing one
      # may still compile and only misbehave under specific compilers or inputs.
      - name: Check vendored CImg patches
        run: Rscript tools/check_cimg_patches.R

      # Every one of these is optional, and configure degrades quietly rather
      # than failing. Assert on the macOS leg that the libraries installed
      # above were really picked up, so a detection regression (or a changed
      # Homebrew layout) fails here instead of going unnoticed behind a green
      # serial build. On Linux/Windows the set of available features differs,
      # so this is deliberately macOS-only.
      - name: Verify configure detected OpenMP, FFTW and TIFF
        if: runner.os == 'macOS'
        run: |
          ./configure
          grep -q 'using OpenMP' config.log \
            || { echo "::error::configure did not enable OpenMP"; exit 1; }
          grep -q 'cimg_use_fftw3' src/Makevars \
            || { echo "::error::configure did not find FFTW"; exit 1; }
          grep -q 'cimg_use_tiff' src/Makevars \
            || { echo "::error::configure did not find libtiff"; exit 1; }
          rm -f config.log config.status src/Makevars

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # --as-cran forces the pragma check on, including for vendored CImg.h.
          args: 'c("--no-manual")'
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: ${{ runner.os == 'Windows' && '"error"' || '"warning"' }}
