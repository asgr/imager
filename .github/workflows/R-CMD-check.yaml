# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # OpenMP, FFTW and TIFF are all optional at build time: configure falls
      # back to a serial CImg-only build when it cannot find them, so a missing
      # formula yields a green run that silently tests far less than intended.
      # Install them explicitly so the macOS leg exercises the full build.
      # libomp is keg-only, which is why configure passes its include directory
      # explicitly rather than relying on it being on the default search path.
      - name: Install X11 and image libraries on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install pkg-config fftw libomp libtiff


      - name: Install X11 on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg \
            xvfb \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxi-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # inst/include/CImg.h is generated at build time from CImg_vanilla.h plus
      # tools/cimg/patches/*.patch, so the patch set is the record of what imager
      # changed in CImg. A patch that no longer applies already fails configure,
      # so this is not about applicability. It guards the inventory: that no
      # expected fix has gone missing and no unlisted patch has appeared. A
      # deleted patch leaves the rest applying cleanly, so the build would stay
      # green while a fix silently vanished, and three of the six only misbehave
      # under specific compilers or inputs that CI may not hit.
      - name: Check CImg patch inventory
        run: Rscript tools/check_cimg_patches.R

      # Windows builds apply the patches via configure.win, which needs the
      # MSYS2 'patch' utility. Rtools ships it (it is in _rtools_msys_pkgs in R's
      # make_rtools_chroot.sh) and setup-r puts it on PATH, but say so explicitly
      # here so a missing toolchain component fails with a clear message rather
      # than a confusing configure error later. This runs on all three runners
      # because all three need patch: configure on macOS/Linux, configure.win on
      # Windows.
      #
      # shell: bash is required and not cosmetic. The default shell on Windows
      # runners is PowerShell, which cannot parse POSIX '[ ... ]' / '||' syntax.
      # GitHub provides Git Bash on windows-latest, so pinning bash makes this
      # one script work unchanged everywhere.
      - name: Confirm patch utility is available
        shell: bash
        run: |
          if ! command -v patch >/dev/null 2>&1; then
            echo "::error::the 'patch' utility is required to build imager (Rtools provides it on Windows)"
            exit 1
          fi
          patch --version | head -1

      # Every one of these is optional, and configure degrades quietly rather
      # than failing. Assert on the macOS leg that the libraries installed
      # above were really picked up, so a detection regression (or a changed
      # Homebrew layout) fails here instead of going unnoticed behind a green
      # serial build. On Linux/Windows the set of available features differs,
      # so this is deliberately macOS-only.
      - name: Verify configure detected OpenMP, FFTW and TIFF
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./configure
          grep -q 'using OpenMP' config.log \
            || { echo "::error::configure did not enable OpenMP"; exit 1; }
          grep -q 'cimg_use_fftw3' src/Makevars \
            || { echo "::error::configure did not find FFTW"; exit 1; }
          grep -q 'cimg_use_tiff' src/Makevars \
            || { echo "::error::configure did not find libtiff"; exit 1; }
          rm -f config.log config.status src/Makevars

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # --as-cran forces the pragma check on, including for vendored CImg.h.
          args: ${{ runner.os == 'Windows' && 'c("--no-manual", "--as-cran")' || 'c("--no-manual")' }}
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: ${{ runner.os == 'Windows' && '"error"' || '"warning"' }}
